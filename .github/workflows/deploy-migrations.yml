# Aplica as migrações em supabase/migrations/ ao projeto Supabase de produção.
# Corre quando chegam migrações novas à main, ou à mão em Actions → "Migrações (produção)" → Run workflow.
# Precisa dos secrets do repositório SUPABASE_ACCESS_TOKEN e SUPABASE_DB_PASSWORD.
name: Migrações (produção)

on:
  push:
    branches: [main]
    paths: ["supabase/migrations/**"]
  workflow_dispatch:

concurrency:
  group: deploy-migrations
  cancel-in-progress: false

jobs:
  push:
    name: supabase db push
    runs-on: ubuntu-latest
    env:
      SUPABASE_PROJECT_REF: ehwxtrxyhffoqudzxriy
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verificar secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Faltam os secrets SUPABASE_ACCESS_TOKEN e/ou SUPABASE_DB_PASSWORD."
            exit 1
          fi
      - run: npx supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - run: npx supabase db push --linked
